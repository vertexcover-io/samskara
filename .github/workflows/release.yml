name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - run: bun install --frozen-lockfile

      # A tag that disagrees with the manifests would ship a tarball named after the wrong release.
      - name: Check the tag matches the version in the manifests
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(node -p "require('./packages/cli/package.json').version")
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $packaged" >&2
            exit 1
          fi

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test:scripts

      - run: bun run test

      - run: bun run release:pack

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
