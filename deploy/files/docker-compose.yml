# Production stack. Installed to /opt/samskara by deploy/deploy.py.
#
# Always invoke with both env files, so compose can resolve the variables below:
#   docker compose --env-file .env --env-file .deploy.env <command>
#
#   POSTGRES_PASSWORD  from .env         generated once by provisioning
#   APP_BIND           from .env         127.0.0.1 behind Caddy, 0.0.0.0 behind a platform proxy
#   SAMSKARA_TAG       from .deploy.env  written by every deploy

name: samskara

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: samskara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: samskara
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samskara -d samskara"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/vertexcover-io/samskara:${SAMSKARA_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
