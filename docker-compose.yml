# Pinned so the project name does not follow the directory. Without it, `docker compose up` run
# from inside a worktree starts a *second* Postgres named after that worktree, and it collides on
# host port 5433 with the one every worktree is already sharing.
name: samskara

services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: samskara
      POSTGRES_PASSWORD: samskara
      POSTGRES_DB: samskara
    volumes:
      - samskara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samskara -d samskara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  samskara_pgdata:
